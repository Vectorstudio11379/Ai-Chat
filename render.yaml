services:
  # FreeLLMAPI Backend Router (Multi-provider LLM gateway)
  - type: web
    name: freellmapi-gateway
    runtime: image
    image:
      url: ghcr.io/tashfeenahmed/freellmapi:latest
    plan: free
    region: oregon
    healthCheckPath: /v1/models
    envVars:
      - key: PORT
        value: "3001"
      - key: HOST_BIND
        value: "0.0.0.0"
      - key: NODE_ENV
        value: "production"
      - key: ENCRYPTION_KEY
        generateValue: true
