services:
  # FreeLLMAPI Unified Developer Studio & AI Gateway (Single URL for Desktop & Mobile)
  - type: web
    name: freellmapi-studio
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: "production"
      # Upstream Free Provider Keys (Persists across Render restarts - never logged out)
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
